<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      width: 280px;
      padding: 14px;
      color: #1a1a1a;
    }
    h1 { font-size: 15px; margin: 0 0 10px; }
    h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #999;
      margin: 16px 0 8px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .row.col { flex-direction: column; align-items: stretch; }
    label { font-size: 12px; display: block; margin-bottom: 4px; color: #555; }
    .value { font-size: 11px; color: #888; float: right; }
    input[type="range"] { width: 100%; }
    .switch { position: relative; width: 38px; height: 20px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: #ccc; border-radius: 20px; transition: .2s;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px;
      left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background-color: #4a90d9; }
    input:checked + .slider:before { transform: translateX(18px); }
    .toggleRow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .toggleRow label { margin-bottom: 0; font-size: 12px; color: #333; }
    .hint { font-size: 10.5px; color: #999; margin: -4px 0 8px; line-height: 1.3; }
  </style>
</head>
<body>
  <div class="row">
    <h1>Silence Skipper</h1>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <h2>Silence</h2>
  <div class="row col">
    <label>Silence threshold <span class="value" id="thresholdVal"></span></label>
    <input type="range" id="threshold" min="-70" max="-20" step="1" />
  </div>
  <div class="row col">
    <label>Min. pause before skipping <span class="value" id="minSilenceVal"></span></label>
    <input type="range" id="minSilence" min="100" max="1500" step="50" />
  </div>
  <div class="row col">
    <label>Speed during silence <span class="value" id="maxSpeedVal"></span></label>
    <input type="range" id="maxSpeed" min="1.5" max="8" step="0.5" />
  </div>

  <h2>Music without speech</h2>
  <div class="toggleRow">
    <label for="skipMusicOnly">Also skip through music-only parts</label>
    <label class="switch">
      <input type="checkbox" id="skipMusicOnly" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="hint">Heuristic-based: detects likely speech vs. music/ambience. Not perfect on every video — tune below if it misfires.</div>
  <div class="row col">
    <label>Speed during music-only <span class="value" id="musicSpeedVal"></span></label>
    <input type="range" id="musicSpeed" min="1.5" max="6" step="0.5" />
  </div>
  <div class="row col">
    <label>Min. duration before skipping <span class="value" id="minMusicVal"></span></label>
    <input type="range" id="minMusic" min="200" max="2000" step="100" />
  </div>

  <h2>Playback</h2>
  <div class="toggleRow">
    <label for="preservePitch">Preserve voice pitch when sped up</label>
    <label class="switch">
      <input type="checkbox" id="preservePitch" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="toggleRow">
    <label for="showIndicator">Show on-screen speed badge</label>
    <label class="switch">
      <input type="checkbox" id="showIndicator" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="hint" style="margin-top: 6px;">Reload the video's tab after changing settings for best results.</div>

  <script src="popup.js"></script>
</body>
</html>
